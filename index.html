<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Портфоліо вчителя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --mint:#d6efe4; --mint-2:#eaf7f1; --mint-3:#a9dcc7; --paper:#fbfefc;
  --violet:#7a63b0; --violet-d:#4e3d82; --ink:#2b2745; --muted:#5d5a78; --line:#cfe6dc;
  --shadow:0 10px 30px -14px rgba(78,61,130,.35);
}
@media (prefers-color-scheme: dark){
  :root{--mint:#17262a; --mint-2:#1d3035; --mint-3:#2f5a55; --paper:#142024; --violet:#b8a6ec; --violet-d:#d9ceff; --ink:#e8f1ee; --muted:#a9bdb8; --line:#2c4a4a; --shadow:0 10px 30px -14px rgba(0,0,0,.6);}
}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:90px}
body{font-family:"Nunito",system-ui,sans-serif;color:var(--ink);background:var(--mint);line-height:1.65;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
svg.i{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}

/* hero */
.hero{background:var(--mint-2);border-bottom:1px solid var(--line)}
.hero .wrap{display:grid;grid-template-columns:230px 1fr;gap:36px;align-items:center;padding-top:44px;padding-bottom:40px}
.langs{position:absolute;top:14px;right:16px;display:flex;gap:4px;background:var(--paper);padding:4px;border-radius:99px;box-shadow:var(--shadow)}
.langs button{border:0;background:none;font:700 .85rem Nunito;padding:6px 14px;border-radius:99px;color:var(--violet);cursor:pointer}
.langs button[aria-pressed=true]{background:var(--violet);color:#fff}
.hero{position:relative}
.photo{width:230px;height:230px;border-radius:50%;padding:7px;background:var(--paper);
  outline:6px dashed var(--violet);outline-offset:6px}
.photo img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
h1{font:600 clamp(2rem,5.4vw,3.6rem)/1.05 Oswald,sans-serif;color:var(--violet);text-transform:uppercase;letter-spacing:.01em}
.role{margin-top:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--violet-d);font-size:clamp(.95rem,2.4vw,1.3rem)}
.quote{margin-top:18px;display:flex;gap:10px;align-items:flex-start;font-style:italic;font-size:1.2rem;color:var(--muted)}
.quote .i{color:var(--violet);width:1.8rem;height:1.8rem;margin-top:2px}

/* tabs */
.tabbar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--mint) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 20px;max-width:1040px;margin:0 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:8px;white-space:nowrap;border:1.5px solid var(--mint-3);background:var(--paper);color:var(--violet-d);
  font:700 .95rem Nunito;padding:9px 16px;border-radius:99px;cursor:pointer;transition:background .2s,color .2s}
.tab:hover{background:var(--mint-2)}
.tab[aria-selected=true]{background:var(--violet);border-color:var(--violet);color:#fff}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}

/* panels */
main{padding:32px 0 56px}
.panel{display:none}.panel.on{display:block;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.panel.on{animation:none}}
.head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.badge{width:56px;height:56px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow)}
.badge .i{width:28px;height:28px}
h2{font:600 clamp(1.5rem,3.6vw,2.2rem) Oswald,sans-serif;color:var(--violet-d);text-transform:uppercase;letter-spacing:.03em}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:26px 28px;box-shadow:var(--shadow)}
.about p{font-size:1.1rem;max-width:68ch}

dl.edu{display:grid;grid-template-columns:minmax(180px,.45fr) 1fr;gap:0}
dl.edu dt,dl.edu dd{padding:14px 0;border-bottom:1px dashed var(--mint-3)}
dl.edu dt{font-weight:800;color:var(--violet-d)}
dl.edu dd{font-weight:600}
dl.edu dt:last-of-type,dl.edu dd:last-of-type{border:0}
.big{font:600 1.6rem Oswald;color:var(--violet)}

ol.courses{list-style:none;padding:0;counter-reset:c;display:grid;gap:14px}
ol.courses li{counter-increment:c;display:grid;grid-template-columns:44px 1fr;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px 22px}
ol.courses li::before{content:counter(c);width:38px;height:38px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font-weight:800}
.c-title{font-weight:700}
.c-meta{color:var(--muted);margin-top:4px;font-size:.95rem}
.c-meta b{color:var(--violet);font-weight:800}

ul.ticks{list-style:none;padding:0;display:grid;gap:12px;margin-top:20px}
ul.ticks li{display:flex;gap:12px;align-items:flex-start}
ul.ticks .i{color:#2f9e6e;width:1.5em;height:1.5em;margin-top:2px}
ul.stars .i{color:var(--violet);fill:var(--violet)}

.sk{display:grid;gap:24px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:18px}
.tool{background:var(--mint-2);border-radius:16px;padding:14px 16px}
.tool .top{display:flex;align-items:center;gap:10px;font-weight:800}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.tool img{height:26px;width:auto;max-width:48px;object-fit:contain}
.bar{height:8px;border-radius:9px;background:var(--line);margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--violet)}
.pct{float:right;color:var(--violet);font-weight:800}
.soft{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px 28px;margin-top:14px}
.s{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--mint-3)}
.s .i{color:var(--violet);width:26px;height:26px}
.s span.n{flex:1;font-weight:600}
.dots{display:flex;gap:4px}.dots b{width:11px;height:11px;border-radius:50%;border:2px solid var(--violet)}
.dots b.f{background:var(--violet)}

footer{background:var(--violet);color:#fff;text-align:center;padding:18px 20px;font-weight:700}
footer .i{fill:#fff;vertical-align:-3px;margin:0 10px}
@media (max-width:720px){
  .hero .wrap{grid-template-columns:1fr;justify-items:center;text-align:center;padding-top:64px}
  .quote{justify-content:center}
  dl.edu{grid-template-columns:1fr}dl.edu dt{border:0;padding-bottom:0}
  .card{padding:20px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="briefcase" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M8 8V5.8c0-1 .8-1.8 1.8-1.8h4.4c1 0 1.8.8 1.8 1.8V8M3 12.5h18M10 12.5v2h4v-2"/></symbol><symbol id="check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m7.5 12.2 3 3 6-6.4"/></symbol><symbol id="communication" viewBox="0 0 24 24"><circle cx="9" cy="9" r="2.5"/><circle cx="17" cy="10" r="2"/><path d="M3.5 19c.3-3 2.2-4.7 5.5-4.7s5.2 1.7 5.5 4.7M15 14.6c2.8-.1 4.5 1.3 5 3.8M14.5 3.8h5a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-1.2l-1.5 1.5V9.8h-2.3a2 2 0 0 1-2-2v-2a2 2 0 0 1 2-2Z"/></symbol><symbol id="creativity" viewBox="0 0 24 24"><path d="M9 17h6m-5 3h4m-3-3v-3.1a5.2 5.2 0 1 1 2 0V17M12 2V.8M4.8 4.8 4 4M19.2 4.8 20 4M3 12H1.8m20.4 0H21"/></symbol><symbol id="critical-thinking" viewBox="0 0 24 24"><path d="M9 16.5v-1.8a5 5 0 1 1 6 0v1.8m-5.5 0h5m-4.5 3h4m-2-3v-2.7"/><circle cx="17.5" cy="16.5" r="3"/><path d="m19.7 18.7 2 2"/></symbol><symbol id="emotional-intelligence" viewBox="0 0 24 24"><path d="M12 20s-8-4.7-8-10.2A4.3 4.3 0 0 1 12 7.2a4.3 4.3 0 0 1 8 2.6C20 15.3 12 20 12 20Z"/><path d="M8.5 11h.1m6.8 0h.1m-6.2 3c1.5 1.2 3.3 1.2 4.8 0"/></symbol><symbol id="flexibility" viewBox="0 0 24 24"><path d="M4 8a8 8 0 0 1 13.6-3L20 7M20 7V3m0 4h-4M20 16a8 8 0 0 1-13.6 3L4 17m0 0v4m0-4h4"/></symbol><symbol id="gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="7"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2m15 0h2M5.3 5.3l1.4 1.4m10.6 10.6 1.4 1.4m0-13.4-1.4 1.4M6.7 17.3l-1.4 1.4"/></symbol><symbol id="graduation-cap" viewBox="0 0 24 24"><path d="m2.5 9 9.5-4.5L21.5 9 12 13.5 2.5 9Z"/><path d="M6 10.7v4.4c3.5 2.4 8.5 2.4 12 0v-4.4M21.5 9v5.2"/><circle cx="21.5" cy="15.7" r=".8"/></symbol><symbol id="heart" viewBox="0 0 24 24"><path d="M20.3 5.8a5 5 0 0 0-7.1 0L12 7l-1.2-1.2a5 5 0 0 0-7.1 7.1l1.2 1.2L12 21l7.1-6.9 1.2-1.2a5 5 0 0 0 0-7.1Z"/></symbol><symbol id="leadership" viewBox="0 0 24 24"><path d="M6 21V3m.5 1H19l-2.5 3L19 10H6.5"/><path d="M3 21h6"/></symbol><symbol id="open-book" viewBox="0 0 24 24"><path d="M12 7.2c-2.4-2.1-5.8-2.7-9-1.8v12.2c3.2-.9 6.6-.3 9 1.8 2.4-2.1 5.8-2.7 9-1.8V5.4c-3.2-.9-6.6-.3-9 1.8Z"/><path d="M12 7.2v12.2M5.5 9.1c1.6-.2 3 .1 4.2.8M18.5 9.1c-1.6-.2-3 .1-4.2.8"/></symbol><symbol id="organization" viewBox="0 0 24 24"><rect x="5" y="4" width="15" height="17" rx="2"/><path d="M9 4V3h7v1M8 9l1.2 1.2L11 8.5m2 1h4m-9 5 1.2 1.2 1.8-1.7m2 1h4"/></symbol><symbol id="person" viewBox="0 0 24 24"><circle cx="12" cy="7.2" r="3.3"/><path d="M5.3 20c.4-3.5 2.8-5.4 6.7-5.4s6.3 1.9 6.7 5.4"/></symbol><symbol id="quotes" viewBox="0 0 24 24"><path d="M10.2 6H6.8A2.8 2.8 0 0 0 4 8.8v2.4A2.8 2.8 0 0 0 6.8 14H9l-.6 4M20 6h-3.4a2.8 2.8 0 0 0-2.8 2.8v2.4a2.8 2.8 0 0 0 2.8 2.8h2.2l-.6 4"/></symbol><symbol id="responsibility" viewBox="0 0 24 24"><path d="M12 3 20 6v5.2c0 4.5-3.2 7.7-8 9.8-4.8-2.1-8-5.3-8-9.8V6l8-3Z"/><path d="m8.5 12.2 2.3 2.3 4.8-5"/></symbol><symbol id="self-development" viewBox="0 0 24 24"><path d="M12 21v-9m0 3c-4.4 0-7-2.3-7-6.5C9.2 8.5 12 10.7 12 15Zm0-4c0-4 2.3-6.5 6.5-6.5 0 3.9-2.2 6.5-6.5 6.5Z"/><path d="M8 21h8"/></symbol><symbol id="star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9L12 3Z"/></symbol><symbol id="teamwork" viewBox="0 0 24 24"><circle cx="12" cy="8" r="2.5"/><circle cx="5" cy="10" r="2"/><circle cx="19" cy="10" r="2"/><path d="M7.5 19c.2-3.2 1.7-5 4.5-5s4.3 1.8 4.5 5M2 18c.2-2.5 1.2-3.8 3-3.8 1.2 0 2 .5 2.5 1.5m14.5 2.3c-.2-2.5-1.2-3.8-3-3.8-1.2 0-2 .5-2.5 1.5"/></symbol><symbol id="trophy" viewBox="0 0 24 24"><path d="M8 4h8v4.5a4 4 0 0 1-8 0V4ZM8 6H4v2a4 4 0 0 0 4 4M16 6h4v2a4 4 0 0 1-4 4M12 12.5V17m-4 3h8m-7-3h6l1 3H8l1-3Z"/></symbol></svg>

<header class="hero">
  <div class="langs" role="group" aria-label="Мова / Language">
    <button data-lang="ua" aria-pressed="true">UA</button>
    <button data-lang="en" aria-pressed="false">EN</button>
  </div>
  <div class="wrap">
    <div class="photo"><img id="photo" alt=""></div>
    <div>
      <h1 id="name"></h1>
      <p class="role" id="role"></p>
      <p class="quote"><svg class="i"><use href="#quotes"/></svg><span id="quote"></span></p>
    </div>
  </div>
</header>

<nav class="tabbar"><div class="tabs" role="tablist" id="tabs"></div></nav>

<main class="wrap" id="panels"></main>

<footer><svg class="i"><use href="#heart"/></svg><span id="foot"></span><svg class="i"><use href="#heart"/></svg></footer>

<script src="data.js"></script>
<script>
const TABS=[["about","person"],["education","graduation-cap"],["courses","open-book"],["experience","briefcase"],["achievements","trophy"],["skills","gear"]];
let lang="ua";
try{const s=localStorage.getItem("lang");if(s)lang=s}catch(e){}
const T=o=>o?(o[lang]??o.ua??""):"";
const ico=n=>`<svg class="i"><use href="#${n}"/></svg>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const head=(k,i)=>`<div class="head"><span class="badge">${ico(i)}</span><h2>${esc(T(DATA.tabs[k]))}</h2></div>`;

function build(){
  const D=DATA,h=D.header;
  document.documentElement.lang=lang==="ua"?"uk":"en";
  document.title=T(h.name)+" — "+T(h.role);
  const ph=document.getElementById("photo");ph.src=h.photo;ph.alt=T(h.name);
  name.textContent=T(h.name);role.textContent=T(h.role);quote.textContent=T(h.quote);foot.textContent=T(h.footer);
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));

  const cur=(location.hash||"#about").slice(1);
  tabs.innerHTML=TABS.map(([k,i])=>`<button class="tab" role="tab" id="t-${k}" data-k="${k}" aria-selected="${k===cur}">${ico(i)}${esc(T(D.tabs[k]))}</button>`).join("");

  const P={};
  P.about=`<div class="card about"><p>${esc(T(D.about.text))}</p></div>`;
  P.education=`<div class="card"><dl class="edu">${D.education.items.map((x,n,a)=>`<dt>${esc(T(x.label))}</dt><dd${n===a.length-1?' class="big"':''}>${esc(T(x.value))}</dd>`).join("")}</dl></div>`;
  P.courses=`<ol class="courses">${D.courses.items.map(c=>`<li><div><div class="c-title">${esc(T(c.title))}</div><div class="c-meta">${esc(T(c.place))}${T(c.hours)?` · <b>${esc(T(c.hours))}</b>`:""} · <b>${esc(c.date)}</b></div></div></li>`).join("")}</ol>`;
  P.experience=`<div class="card"><p>${esc(T(D.experience.intro))}</p><ul class="ticks">${D.experience.items.map(x=>`<li>${ico("check-circle")}<span>${esc(T(x))}</span></li>`).join("")}</ul></div>`;
  P.achievements=`<div class="card"><ul class="ticks stars" style="margin-top:0">${D.achievements.items.map(x=>`<li>${ico("star")}<span>${esc(T(x))}</span></li>`).join("")}</ul></div>`;
  P.skills=`<div class="sk"><div class="card"><h3>${esc(T(D.tools.title))}</h3><div class="tools">${D.tools.items.map(t=>`<div class="tool"><div class="top">${t.logo?`<img src="${esc(t.logo)}" alt="">`:`<span class="dot" style="background:${esc(t.color)}"></span>`}<span>${esc(t.name)}</span><span class="pct" style="margin-left:auto">${t.level}%</span></div><div class="bar"><i style="width:${t.level}%"></i></div></div>`).join("")}</div></div>
  <div class="card"><h3>${esc(T(D.soft.title))}</h3><div class="soft">${D.soft.items.map(s=>`<div class="s">${ico(s.icon)}<span class="n">${esc(T(s.name))}</span><span class="dots" aria-label="${s.level}/5">${[1,2,3,4,5].map(n=>`<b class="${n<=s.level?"f":""}"></b>`).join("")}</span></div>`).join("")}</div></div></div>`;

  panels.innerHTML=TABS.map(([k,i])=>`<section class="panel${k===cur?" on":""}" id="p-${k}" role="tabpanel" aria-labelledby="t-${k}">${head(k,i)}${P[k]}</section>`).join("");
}
function show(k){
  document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id==="p-"+k));
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.k===k));
  try{history.replaceState(null,"","#"+k)}catch(e){location.hash=k}
  scrollTo({top:document.querySelector(".tabbar").offsetTop-0,behavior:"smooth"});
}
document.addEventListener("click",e=>{
  const t=e.target.closest(".tab");if(t)return show(t.dataset.k);
  const l=e.target.closest("[data-lang]");if(l){lang=l.dataset.lang;try{localStorage.setItem("lang",lang)}catch(_){}build()}
});
addEventListener("hashchange",build);
build();
</script>
</body>
</html>
